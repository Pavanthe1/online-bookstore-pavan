<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageTurner - Online Bookstore</title>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <header>
        <h1>PageTurner</h1>
        <p>Discover books, find your next read, and order online.</p>
        <p>Books available: <span id="bookCount">Loading...</span></p>
    </header>

    <main>
        <section>
            <h2>Browse Books</h2>
            <label for="searchInput">Search by title or author:</label>
            <input type="search" id="searchInput" placeholder="Search books...">

            <div id="categoryFilters">
                <button type="button" data-category="all">All Books</button>
                <button type="button" data-category="Programming">Programming</button>
                <button type="button" data-category="Self-Help">Self-Help</button>
                <button type="button" data-category="Fiction">Fiction</button>
                <button type="button" data-category="Biography">Biography</button>
                <button type="button" data-category="Productivity">Productivity</button>
            </div>

            <div id="bookGrid" aria-live="polite">
                Loading books...
            </div>
        </section>

        <section>
            <h2>Shopping Cart</h2>
            <button type="button" id="cartButton">
                View Cart (<span id="cartCount">0</span>)
            </button>

            <div id="cartSection" hidden>
                <div id="cartItems"></div>
                <p>Total: ₹<span id="cartTotal">0</span></p>

                <form id="checkoutForm">
                    <label for="customerName">Your name:</label>
                    <input
                        type="text"
                        id="customerName"
                        name="customerName"
                        required
                        maxlength="100"
                    >
                    <button type="submit" id="placeOrderButton">
                        Place Order
                    </button>
                </form>

                <p id="checkoutMessage" role="status"></p>
            </div>
        </section>

        <section>
            <h2>Track Your Order</h2>
            <form id="trackingForm">
                <label for="orderIdInput">Order ID:</label>
                <input
                    type="number"
                    id="orderIdInput"
                    min="1001"
                    required
                >
                <button type="submit">Track Order</button>
            </form>
            <div id="trackingResult" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <p>PageTurner Online Bookstore</p>
    </footer>
</body>
</html>
